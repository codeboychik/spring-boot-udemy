version: '3.8'

services:
  postgres:
    build:
     context: .
     dockerfile: Dockerfile.postgres
    container_name: pg
    environment:
      POSTGRES_USER: pg
      POSTGRES_PASSWORD: test
      POSTGRES_DB: postgres
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  userapi:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - 8080
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/postgres
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    command: ["java", "-jar", "userapi.jar"]

volumes:
  pgdata:
